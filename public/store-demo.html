<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hawthorne Lane — UK Fashion Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #12100e;
      color: #f5ede4;
      line-height: 1.5;
    }
    .shell { max-width: 1040px; margin: 0 auto; padding: 28px 20px 56px; }
    header {
      padding-bottom: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(198, 167, 125, 0.22);
    }
    .brand { font-size: 1.6rem; letter-spacing: 0.05em; }
    .brand em { color: #c6a77d; font-style: italic; font-weight: 400; }
    .sub {
      margin: 6px 0 0;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: rgba(245, 237, 228, 0.55);
    }
    .page { display: none; }
    .page.is-open { display: block; }
    h1 { font-weight: 400; font-size: 1.75rem; margin: 0 0 10px; }
    .lead {
      margin: 0 0 28px;
      font-family: system-ui, sans-serif;
      color: rgba(245, 237, 228, 0.62);
      max-width: 46ch;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }
    .card {
      display: block;
      width: 100%;
      padding: 0;
      border: 1px solid rgba(198, 167, 125, 0.18);
      border-radius: 4px;
      background: #1c1916;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover {
      border-color: rgba(198, 167, 125, 0.45);
      transform: translateY(-2px);
    }
    .card-photo {
      aspect-ratio: 3 / 4;
      background-size: cover;
      background-position: center top;
      background-color: #2a2520;
    }
    .card-body { padding: 14px 16px 16px; }
    .card-tag {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c6a77d;
    }
    .card-name { font-size: 1.05rem; margin: 6px 0 4px; }
    .card-price {
      font-family: system-ui, sans-serif;
      font-weight: 600;
      font-size: 15px;
    }
    .back {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: none;
      border: 0;
      color: #c6a77d;
      cursor: pointer;
      padding: 0;
      margin-bottom: 24px;
    }
    .back:hover { text-decoration: underline; }
    .pdp {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
      align-items: start;
    }
    @media (max-width: 720px) { .pdp { grid-template-columns: 1fr; } }
    .pdp-photo img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
      background: #2a2520;
    }
    .pdp-tag {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c6a77d;
    }
    .pdp-name { font-size: 1.85rem; font-weight: 400; margin: 8px 0 12px; }
    .pdp-price {
      font-family: system-ui, sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 18px;
    }
    .pdp-desc {
      font-family: system-ui, sans-serif;
      color: rgba(245, 237, 228, 0.68);
      margin: 0;
    }
    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid rgba(198, 167, 125, 0.18);
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: rgba(245, 237, 228, 0.45);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="shell">
    <header>
      <div class="brand">Hawthorne <em>Lane</em></div>
      <p class="sub">Marylebone, London · Fit Room widget demo</p>
    </header>

    <div id="shop" class="page is-open">
      <h1>The Edit</h1>
      <p class="lead">Six pieces from our atelier — select an item to view details and try on with Wear Me.</p>
      <div class="grid" id="grid"></div>
    </div>

    <div id="product" class="page">
      <button type="button" class="back" id="btn-back">← Back to shop</button>
      <div class="pdp">
        <div class="pdp-photo">
          <img id="pdp-img" alt="" width="640" height="853" />
        </div>
        <div>
          <div class="pdp-tag" id="pdp-tag"></div>
          <h2 class="pdp-name" id="pdp-name"></h2>
          <p class="pdp-price" id="pdp-price"></p>
          <p class="pdp-desc" id="pdp-desc"></p>
        </div>
      </div>
    </div>

    <footer>Demo storefront · Complimentary UK returns within 30 days</footer>
  </div>

  <script>
    (function () {
      var ITEMS = [
        {
          tag: "Dress",
          name: "Somerset Linen Midi",
          price: 165,
          img: "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=900&q=85",
          alt: "Terracotta linen dress on wooden hanger",
          desc: "Relaxed A-line in washed Italian linen with adjustable straps and deep side pockets."
        },
        {
          tag: "Coat",
          name: "Highland Wool Wrap Coat",
          price: 395,
          img: "https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=900&q=85",
          alt: "Charcoal wool coat on mannequin",
          desc: "Double-faced merino wool with tie belt, fully lined for crisp British winters."
        },
        {
          tag: "Shirt",
          name: "Devon Cotton Poplin Shirt",
          price: 89,
          img: "https://images.unsplash.com/photo-1626497764749-6b77a20f2a1b?w=900&q=85",
          alt: "White cotton shirt on hanger",
          desc: "Oxford collar with mother-of-pearl buttons and a curved hem."
        },
        {
          tag: "Knit",
          name: "Kensington Cashmere Knit",
          price: 175,
          img: "https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=900&q=85",
          alt: "Oatmeal cashmere jumper on hanger",
          desc: "Fine-gauge Scottish cashmere crew neck with ribbed cuffs and hem."
        },
        {
          tag: "Dress",
          name: "Cotswold Silk Slip",
          price: 245,
          img: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=900&q=85",
          alt: "Champagne silk dress on mannequin",
          desc: "Bias-cut mulberry silk with cowl neckline and adjustable straps."
        },
        {
          tag: "Jacket",
          name: "Mayfair Tailored Blazer",
          price: 285,
          img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=900&q=85",
          alt: "Navy blazer on mannequin",
          desc: "Single-breasted brushed wool crepe with soft shoulder and peak lapel."
        }
      ];

      var shop = document.getElementById("shop");
      var product = document.getElementById("product");
      var grid = document.getElementById("grid");
      var pdpImg = document.getElementById("pdp-img");

      function gbp(n) { return "£" + n.toFixed(2); }

      function resetWidgetWrap(img) {
        var wrap = img.closest(".dq-wrap");
        if (wrap && wrap.parentNode) {
          wrap.parentNode.insertBefore(img, wrap);
          wrap.parentNode.removeChild(wrap);
        }
        img.removeAttribute("data-fit-room-tryon-bound");
        img.removeAttribute("data-fit-room-tryon-skip");
        img.removeAttribute("data-fit-room-tryon-pending-load");
      }

      function openShop() {
        shop.classList.add("is-open");
        product.classList.remove("is-open");
        document.title = "Hawthorne Lane — UK Fashion Demo";
      }

      function openProduct(item) {
        document.getElementById("pdp-tag").textContent = item.tag;
        document.getElementById("pdp-name").textContent = item.name;
        document.getElementById("pdp-price").textContent = gbp(item.price);
        document.getElementById("pdp-desc").textContent = item.desc;

        resetWidgetWrap(pdpImg);
        pdpImg.alt = item.alt;
        pdpImg.src = item.img;

        shop.classList.remove("is-open");
        product.classList.add("is-open");
        document.title = item.name + " — Hawthorne Lane";

        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            window.dispatchEvent(new Event("fit-room-rescan"));
          });
        });
      }

      ITEMS.forEach(function (item) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card";

        var photo = document.createElement("div");
        photo.className = "card-photo";
        photo.style.backgroundImage = "url(" + item.img + ")";

        var body = document.createElement("div");
        body.className = "card-body";

        var tag = document.createElement("div");
        tag.className = "card-tag";
        tag.textContent = item.tag;

        var name = document.createElement("div");
        name.className = "card-name";
        name.textContent = item.name;

        var price = document.createElement("div");
        price.className = "card-price";
        price.textContent = gbp(item.price);

        body.appendChild(tag);
        body.appendChild(name);
        body.appendChild(price);
        btn.appendChild(photo);
        btn.appendChild(body);
        btn.addEventListener("click", function () { openProduct(item); });
        grid.appendChild(btn);
      });

      document.getElementById("btn-back").addEventListener("click", openShop);
    })();
  </script>

  <script
    defer
    src="/widget.js"
    data-fit-room-key="KgU7HRdnv-TjExraQsyI0Hjanzhh3P-BgG4mguLP4lM"
    data-fit-room-bind="all"
  ></script>

</body>
</html>
